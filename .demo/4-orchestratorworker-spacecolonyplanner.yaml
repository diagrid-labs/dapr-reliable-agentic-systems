title: 4 - Orchestrator Worker - Space Colony Planner
description: ''
version: 2
demos:
  - id: demo-mk2ja73h-pqrs
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd SpaceColonyPlanner
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: dapr-run
        autoExecute: true
      - action: executeTerminalCommand
        command: dapr run -f .
        terminalId: dapr-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: demo-mk2ja84k-tuv
    title: Start workflow
    steps:
      - action: highlight
        path: SpaceColonyPlanner/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: demo-mk2ja91m-wxyz
    title: Stop the workflow app
    steps:
      - action: executeTerminalCommand
        terminalId: dapr-run
        command: \u0003
        autoExecute: true
      - action: waitForTimeout
        timeout: 500
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
        terminalId: dapr-run
    icons:
      start: terminal
      end: ''
