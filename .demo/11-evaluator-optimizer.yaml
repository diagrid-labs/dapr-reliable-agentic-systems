  - id: scene-mkb3lvzz-oyk7
    title: Start workflow
    steps:
      - action: highlight
        path: AlienTranslator/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: scene-mkb3lxd1-ivgu
    title: Stop the workflow app
    steps:
      - action: focusTerminal
        terminalId: dapr-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 200
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
        terminalId: dapr-run
    icons:
      start: terminal
      end: ''
