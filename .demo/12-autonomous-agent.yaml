title: 12 - Autonomous Agent
description: ''
version: 2
demos:
  - title: Autonomous Agent Overview
    id: scene-mk5h3g84-mlhm
    steps:
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-01-overview.md
  - title: Autonomous Agent Diagram
    id: scene-mk5h3i02-q1nn
    steps:
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-02-diagram.md
  - title: Implementation
    id: scene-mk5h3k6b-dlmq
    steps:
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-03-implementation.md
  - title: Demo - Space Debris Agent
    id: scene-mk5h3m9a-t5b6
    steps:
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-04-demo.md
  - id: scene-mkb3njij-6q2c
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd SpaceDebrisAgent
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: dapr-run
        autoExecute: true
      - action: executeTerminalCommand
        command: dapr run -f .
        terminalId: dapr-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: scene-mkb3nkrx-8xbi
    title: Start workflow
    steps:
      - action: highlight
        path: SpaceDebrisAgent/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: scene-mkb3nme9-36la
    title: Stop the workflow app
    steps:
      - action: focusTerminal
        terminalId: dapr-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 2000
      - action: executeTerminalCommand
        command: cd ..
        terminalId: dapr-run
    icons:
      start: terminal
      end: close
