title: 12 - Autonomous Agent
description: ''
version: 2
demos:
  - title: Autonomous Agent Overview
    id: scene-mk5h3g84-mlhm
    steps:
      - action: setPresentationView
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-01-autonomous-agent-intro.md
  - title: Autonomous Agent Diagram
    id: scene-mk5h3i02-q1nn
    steps:
      - action: markdownPreview
        path: .demo/slides/12-autonomous-agent/12-02-diagram.md
  - title: Autonomous Agent Use Cases
    id: scene-mk5h3k6b-dlme
    steps:
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-03-autonomous-agent-explanation.md
        slide: 1
  - title: Demo - Space Debris Agent
    id: scene-mk5h3m9a-t5b6
    steps:
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-04-demo.md
  - id: scene-mkb3njij-6q2c
    title: Run workflow app
    steps:
      - action: markdownPreview
        path: .demo/slides/12-autonomous-agent/12-05-demo-diagram.md
      - action: executeTerminalCommand
        command: cd SpaceDebrisAgent
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
        terminalId: aspire-run
      - action: executeTerminalCommand
        command: aspire run
        terminalId: aspire-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: scene-mkb3nkrx-8xbi
    title: Start workflow
    steps:
      - action: showInfoMessage
        message: Open the Aspire Dashboard and click the URL of the web resource to open the Space Debris Agent UI, then start the workflow
    icons:
      start: arrow-right
      end: ''
  - id: demo-mpkz72d6-u747
    title: Inspect workflow state
    steps:
      - action: showInfoMessage
        message: Open the Dapr Dev Dashboard
    icons:
      start: dashboard
      end: ''
  - id: scene-mkb3nme9-36la
    title: Stop the workflow app
    steps:
      - action: openTerminal
        terminalId: aspire-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 2000
      - action: closeTerminal
        terminalId: aspire-run
      - action: executeVSCodeCommand
        command: workbench.action.closePanel
    icons:
      start: terminal
      end: ''
  - id: scene-hl12p-0
    title: Dapr configuration
    steps:
