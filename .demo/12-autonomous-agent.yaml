    id: scene-mk5h3m9a-t5b6
    steps:
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-04-demo.md
  - title: Demo Diagram
    id: scene-mk5h3n1f-o5p6
    steps:
      - action: markdownPreview
        path: .demo/slides/12-autonomous-agent/12-05-demo-diagram.md
  - id: scene-mkb3njij-6q2c
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd SpaceDebrisAgent
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: aspire-run
        autoExecute: true
      - action: executeTerminalCommand
        command: aspire run
        terminalId: aspire-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: scene-mkb3njij-6q2d
    title: SpaceDebrisCleanupWorkflow
    steps:
      - action: highlight
        path: SpaceDebrisAgent/SpaceDebrisAgent.ApiService/Workflows/SpaceDebrisCleanupWorkflow.cs
        position: '8'
        highlightWholeLine: true
    icons:
      start: code
      end: ''
  - id: scene-mkb3njij-6q2e
    title: AgentReasoningActivity
    steps:
      - action: highlight
        path: SpaceDebrisAgent/SpaceDebrisAgent.ApiService/Activities/Agent/AgentReasoningActivity.cs
        position: '10'
        highlightWholeLine: true
    icons:
      start: code
      end: ''
  - id: scene-mkb3nkrx-8xbi
    title: Start workflow
    steps:
      - action: highlight
        path: SpaceDebrisAgent/SpaceDebrisAgent.ApiService/SpaceDebrisAgent.ApiService.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: scene-mkb3nme9-36la
    title: Stop the workflow app
    steps:
      - action: focusTerminal
        terminalId: aspire-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 2000
      - action: executeTerminalCommand
        command: cd ..
        terminalId: aspire-run
    icons:
      start: terminal
      end: close
  - title: Autonomous Agent Pros/Cons
    id: scene-mkvn9pni-m9uh
    steps:
      - action: setPresentationView
      - action: openSlide
        path: .demo/slides/12-autonomous-agent/12-06-autonomous-agent-final.md
