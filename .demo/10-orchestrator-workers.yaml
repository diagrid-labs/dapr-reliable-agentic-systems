    steps:
      - action: showInfoMessage
        message: Open Diagrid Dev Dashboard
    icons:
      start: dashboard
      end: ''
  - id: scene-mkb32n34-vuoe
    title: Stop the workflow app
    steps:
      - action: focusTerminal
        terminalId: aspire-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 200
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
        terminalId: aspire-run
    icons:
      start: terminal
      end: ''
