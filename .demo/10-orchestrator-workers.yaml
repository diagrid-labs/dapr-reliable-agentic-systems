        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: scene-mkb32l72-xbfd
    title: Start workflow
    steps:
      - action: highlight
        path: SpaceColonyPlanner/SpaceColonyPlanner.ApiService/SpaceColonyPlanner.ApiService.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: scene-mkb32jje-lewd
    title: ColonyOrchestratorWorkflow
    steps:
