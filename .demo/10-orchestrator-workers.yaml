    id: scene-mk5h32b7-xqky
    steps:
      - action: openSlide
        path: .demo/slides/10-orchestrator-workers/10-04-demo.md
  - id: scene-mkb32jje-lewc
    title: Run workflow app
    steps:
      - action: markdownPreview
        path: .demo/slides/10-orchestrator-workers/10-05-demo-diagram.md
      - action: executeTerminalCommand
        command: cd SpaceColonyPlanner
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
        terminalId: aspire-run
      - action: executeTerminalCommand
        command: aspire run
        terminalId: aspire-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: scene-mkb32l72-xbfd
    title: Start workflow
    steps:
      - action: showInfoMessage
        message: Open the Aspire Dashboard and click the URL of the web resource to open the Space Colony Planner UI, then start the workflow
    icons:
      start: arrow-right
      end: ''
  - id: demo-mpkxztnq-lenm
    title: Inspect workflow state
    steps:
      - action: showInfoMessage
        message: Open the Dapr Dev Dashboard
    icons:
      start: dashboard
      end: ''
  - id: scene-mkb32n34-vuoe
    title: Stop the workflow app
    steps:
      - action: openTerminal
        terminalId: aspire-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 2000
      - action: closeTerminal
        terminalId: aspire-run
      - action: executeVSCodeCommand
        command: workbench.action.closePanel
    icons:
      start: terminal
      end: ''
  - id: scene-hl10p-0
    title: Dapr configuration
    steps:
