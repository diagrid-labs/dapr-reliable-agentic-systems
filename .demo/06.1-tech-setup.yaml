title: 6 - Local Setup
description: ''
version: 2
demos:
  - id: scene-mkdznzw9-f6ir
    title: Local setup
    steps:
      - action: openSlide
        path: .demo/slides/06-combining-workflow-llm/06-02-tech-setup.md
      - action: setPresentationView
  - id: scene-mkcnxjt6-bakh
    title: Start Ollama
    steps:
      - action: executeTerminalCommand
        terminalId: ollama-server
        insertTypingMode: character-by-character
        insertTypingSpeed: 50
        autoExecute: true
        command: OLLAMA_CONTEXT_LENGTH=8192 ollama serve
    icons:
      start: terminal
      end: ''
  - id: scene-mkcnxl2j-koo2
    title: Run model
    steps:
      - action: executeTerminalCommand
        terminalId: ollama-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
        command: ollama run llama3.2:3b
    icons:
      start: terminal
      end: ''
  - id: scene-mkcnxn4m-yue1
    title: Run Diagrid Dashboard
    steps:
      - action: executeTerminalCommand
        command: docker run -p 8080:8080 ghcr.io/diagridio/diagrid-dashboard:latest
        terminalId: diagrid-dashboard
        insertTypingMode: character-by-character
        insertTypingSpeed: 50
    icons:
      start: terminal
      end: ''
  - id: scene-mkqthaom-gju9
    title: Conversation component
    steps:
      - action: open
        path: Resources/conversation.yaml
