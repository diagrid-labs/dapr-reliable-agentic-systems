{
  "title": "1 - AnomalyAnalysis",
  "description": "",
  "version": 2,
  "demos": [
    {
      "id": "demo-mj9xepec-l91m",
      "title": "Start Ollama",
      "steps": [
        {
          "action": "executeTerminalCommand",
          "terminalId": "ollama-server",
          "insertTypingMode": "character-by-character",
          "insertTypingSpeed": 75,
          "autoExecute": true,
          "command": "ollama serve"
        }
      ],
      "icons": {
        "start": "terminal",
        "end": ""
      }
    },
    {
      "id": "demo-mj9xg49s-w0kw",
      "title": "Run model",
      "steps": [
        {
          "action": "executeTerminalCommand",
          "terminalId": "ollama-run",
          "insertTypingMode": "character-by-character",
          "insertTypingSpeed": 75,
          "autoExecute": true,
          "command": "ollama run phi3:3.8b"
        }
      ],
      "icons": {
        "start": "terminal",
        "end": ""
      }
    },
    {
      "id": "demo-mj9xhxhu-gcrc",
      "title": "Run Diagrid Dashboard",
      "steps": [
        {
          "action": "executeTerminalCommand",
          "command": "docker run -p 8080:8080 ghcr.io/diagridio/diagrid-dashboard:latest",
          "terminalId": "diagrid-dashboard",
          "insertTypingMode": "character-by-character",
          "insertTypingSpeed": 75
        }
      ],
      "icons": {
        "start": "terminal",
        "end": ""
      }
    },
    {
      "id": "demo-mj9xjndp-gwbi",
      "title": "Run workflow app",
      "steps": [
        {
          "action": "executeTerminalCommand",
          "command": "cd AnomalyAnalysis",
          "insertTypingMode": "character-by-character",
          "insertTypingSpeed": 75,
          "terminalId": "dapr-run"
        },
        {
          "action": "executeTerminalCommand",
          "command": "dapr run -f .",
          "terminalId": "dapr-run",
          "insertTypingMode": "character-by-character",
          "insertTypingSpeed": 75,
          "autoExecute": true
        }
      ],
      "icons": {
        "start": "terminal",
        "end": ""
      }
    },
    {
      "id": "demo-mj9y3t6q-6rji",
      "title": "Start workflow",
      "steps": [
        {
          "action": "highlight",
          "path": "AnomalyAnalysis/local.http",
          "position": "3",
          "highlightWholeLine": true
        }
      ],
      "icons": {
        "start": "arrow-right",
        "end": ""
      }
    },
    {
      "id": "demo-mj9xx4f9-5d35",
      "title": "Stop the workflow app",
      "steps": [
        {
          "action": "executeTerminalCommand",
          "terminalId": "dapr-run",
          "command": "\\u0003",
          "autoExecute": true
        }
      ],
      "icons": {
        "start": "terminal",
        "end": ""
      }
    }
  ]
}