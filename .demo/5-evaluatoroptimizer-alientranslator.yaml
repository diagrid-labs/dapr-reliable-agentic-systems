title: 5 - Evaluator Optimizer - Alien Translator
description: ''
version: 2
demos:
  - id: demo-mk2jb73h-abcd
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd AlienTranslator
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: dapr-run
        autoExecute: true
      - action: executeTerminalCommand
        command: dapr run -f .
        terminalId: dapr-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: demo-mk2jb84k-efgh
    title: Start workflow
    steps:
      - action: highlight
        path: AlienTranslator/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: demo-mk2jb91m-ijkl
    title: Stop the workflow app
    steps:
      - action: executeTerminalCommand
        terminalId: dapr-run
        command: \u0003
        autoExecute: true
      - action: waitForTimeout
        timeout: 500
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
        terminalId: dapr-run
    icons:
      start: terminal
      end: ''
