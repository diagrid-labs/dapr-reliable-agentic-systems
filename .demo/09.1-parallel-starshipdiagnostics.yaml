title: 9 - Parallel - Starship Diagnostics
description: ''
version: 2
demos:
  - id: demo-mk1hy63g-rnng
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd StarshipDiagnostics
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: dapr-run
        autoExecute: true
      - action: executeTerminalCommand
        command: dapr run -f .
        terminalId: dapr-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: demo-mk1hy9ru-c0cb
    title: Start workflow
    steps:
      - action: highlight
        path: StarshipDiagnostics/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: demo-mk1hyf5h-37lg
    title: Stop the workflow app
    steps:
      - action: executeTerminalCommand
        terminalId: dapr-run
        command: \u0003
        autoExecute: true
      - action: waitForTimeout
        timeout: 500
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
        terminalId: dapr-run
    icons:
      start: terminal
      end: ''
