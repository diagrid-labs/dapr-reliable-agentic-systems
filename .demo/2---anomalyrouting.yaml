title: 2 - AnomalyRouting
description: ''
version: 2
demos:
  - id: demo-mjbfmxst-f500
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd GalacticAnomalyClassifier
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: dapr-run
      - action: executeTerminalCommand
        command: dapr run -f .
        terminalId: dapr-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: demo-mjbfn04c-bcw8
    title: Start workflow
    steps:
      - action: highlight
        path: GalacticAnomalyClassifier/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: demo-mjbfn291-my6n
    title: Stop the workflow app
    steps:
      - action: executeTerminalCommand
        terminalId: dapr-run
        command: \u0003
        autoExecute: true
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
    icons:
      start: terminal
      end: ''
