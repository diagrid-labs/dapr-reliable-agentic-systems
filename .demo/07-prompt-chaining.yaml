  - title: Demo - Spatial Anomaly Analysis System
    id: scene-mk5h1ymh-q6vd
    steps:
      - action: openSlide
        path: .demo/slides/07-prompt-chaining/07-04-demo.md
  - id: scene-mkb26rj8-stv6
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd AnomalyAnalysis
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
        terminalId: aspire-run
      - action: executeTerminalCommand
        command: aspire run
        terminalId: aspire-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - title: Demo Diagram
    id: scene-mk5h1z1a-c3d4
    steps:
      - action: markdownPreview
        path: .demo/slides/07-prompt-chaining/07-05-demo-diagram.md
  - id: scene-mkb26t53-hukh
    title: Start workflow
    steps:
      - action: showInfoMessage
        message: Open the Aspire Dashboard and click the URL of the web resource to open the Spatial Anomaly Analysis UI, then start the workflow
    icons:
      start: arrow-right
      end: ''
  - id: demo-mpkw6pc4-8hzl
    title: Inspect workflow state
    steps:
      - action: showInfoMessage
        message: Open the Dapr Dev Dashboard
    icons:
      start: dashboard
      end: ''
  - id: scene-mkb26v5t-dwo0
    title: Stop the workflow app
    steps:
      - action: focusTerminal
        terminalId: aspire-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 500
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
        terminalId: aspire-run
      - action: waitForTimeout
        timeout: 500
      - action: executeVSCodeCommand
        command: workbench.action.terminal.toggleTerminal
    icons:
      start: terminal
      end: ''
