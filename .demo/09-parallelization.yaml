    id: scene-mk5h2ogm-1p35
    steps:
      - action: openSlide
        path: .demo/slides/09-parallelization/09-04-demo.md
  - id: scene-mkb2csbu-w72j
    title: Run workflow app
    steps:
      - action: markdownPreview
        path: .demo/slides/09-parallelization/09-05-demo-diagram.md
      - action: executeTerminalCommand
        command: cd StarshipDiagnostics
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
        terminalId: aspire-run
      - action: executeTerminalCommand
        command: aspire run
        terminalId: aspire-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: scene-mkb2ctl7-haoq
    title: Start workflow
    steps:
      - action: showInfoMessage
        message: Open the Aspire Dashboard and click the URL of the web resource to open the Starship Diagnostics UI, then start the workflow
    icons:
      start: arrow-right
      end: ''
  - id: demo-mpkz5xdp-ejxy
    title: Inspect workflow state
    steps:
      - action: showInfoMessage
        message: Open the Dapr Dev Dashboard
    icons:
      start: dashboard
      end: ''
  - id: scene-mkb2cv2y-avsr
    title: Stop the workflow app
    steps:
      - action: openTerminal
        terminalId: aspire-run
      - action: sendKeybinding
        keybinding: ctrl+c
      - action: waitForTimeout
        timeout: 2000
      - action: closeTerminal
        terminalId: aspire-run
      - action: executeVSCodeCommand
        command: workbench.action.closePanel
    icons:
      start: terminal
      end: ''
