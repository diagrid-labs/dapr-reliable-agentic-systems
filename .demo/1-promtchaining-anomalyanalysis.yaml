title: 1 - Prompt Chaining - AnomalyAnalysis
description: ''
version: 2
demos:
  - id: demo-mj9xjndp-gwbi
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd AnomalyAnalysis
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: dapr-run
      - action: executeTerminalCommand
        command: dapr run -f .
        terminalId: dapr-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: demo-mj9y3t6q-6rji
    title: Start workflow
    steps:
      - action: highlight
        path: AnomalyAnalysis/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: demo-mj9xx4f9-5d35
    title: Stop the workflow app
    steps:
      - action: executeTerminalCommand
        terminalId: dapr-run
        command: \u0003
        autoExecute: true
      - action: waitForTimeout
        timeout: 500
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
    icons:
      start: terminal
      end: ''
