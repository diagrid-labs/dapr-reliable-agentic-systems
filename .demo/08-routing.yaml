title: 8 - Routing
description: ''
version: 2
demos:
  - title: Routing Overview
    id: scene-mk5h29o6-6qr1
    steps:
      - action: openSlide
        path: .demo/slides/08-routing/08-01-overview.md
  - title: Routing Diagram
    id: scene-mk5h2b5e-94a4
    steps:
      - action: openSlide
        path: .demo/slides/08-routing/08-02-diagram.md
  - title: Implementation
    id: scene-mk5h2cra-3csw
    steps:
      - action: openSlide
        path: .demo/slides/08-routing/08-03-implementation.md
  - title: Demo - Anomaly Classification
    id: scene-mk5h2epa-7cu6
    steps:
      - action: openSlide
        path: .demo/slides/08-routing/08-04-demo.md
  - id: scene-mkb28oma-vekm
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd GalacticAnomalyClassifier
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        terminalId: dapr-run
      - action: executeTerminalCommand
        command: dapr run -f .
        terminalId: dapr-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
  - id: scene-mkb28qaj-1wp1
    title: Start workflow
    steps:
      - action: highlight
        path: GalacticAnomalyClassifier/local.http
        position: '3'
        highlightWholeLine: true
    icons:
      start: arrow-right
      end: ''
  - id: scene-mkb28tio-ohx6
    title: Stop the workflow app
    steps:
      - action: focusTerminal
        terminalId: dapr-run
      - action: sendKeybinding
        keybinding: ctrl+b
      - action: waitForTimeout
        timeout: 200
      - action: executeTerminalCommand
        command: cd ..
        autoExecute: true
        terminalId: dapr-run
    icons:
      start: terminal
      end: ''
