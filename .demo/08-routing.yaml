  - id: scene-mkb28oma-vekm
    title: Run workflow app
    steps:
      - action: executeTerminalCommand
        command: cd GalacticAnomalyClassifier
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
        terminalId: aspire-run
      - action: executeTerminalCommand
        command: aspire run
        terminalId: aspire-run
        insertTypingMode: character-by-character
        insertTypingSpeed: 75
        autoExecute: true
    icons:
      start: terminal
      end: ''
